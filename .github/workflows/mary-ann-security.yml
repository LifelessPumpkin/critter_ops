name: Mary Ann - Security Scanning

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan source code
        run: >-
          semgrep scan
          --config p/default
          --error
          --strict
          --metrics off
          --exclude '**/node_modules/**'
          --exclude '**/.next/**'
          --exclude '**/bin/**'
          --exclude '**/obj/**'
          --exclude '**/build/**'
          --exclude '**/dist/**'
          --exclude '**/coverage/**'
          .

  trivy:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Resolve .NET dependencies for scanning
        run: dotnet restore apps/skipper-api/skipper-api.csproj --use-lock-file

      - name: Scan dependency manifests and lock files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: false
          skip-dirs: '**/node_modules,**/.next,**/bin,**/obj,**/build,**/dist,**/coverage'

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository and Git history for verified secrets
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo"
          --workdir /repo
          ghcr.io/trufflesecurity/trufflehog:3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
          git file:///repo
          --results verified
          --fail
          --fail-on-scan-errors
          --no-update
          --github-actions
